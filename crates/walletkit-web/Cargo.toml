[package]
name = "walletkit-web"
description = "wasm-bindgen facade over WalletKit for the @worldcoin/walletkit-web browser package."
publish = false
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

# The facade only exists for browser WASM; on every other target the crate is empty.
[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
js-sys = "0.3.103"
wasm-bindgen = "=0.2.126"
wasm-bindgen-futures = "0.4.76"
walletkit-core = { workspace = true, features = ["embed-zkeys"] }
zeroize = { workspace = true }
selfie-enrollment-client = { git = "https://github.com/worldcoin/biometrics-tee", rev = "58ad2b3cc93570d421c2da2c4ab058ed98ef88c0", default-features = false }
selfie-enrollment-sealed-types = { git = "https://github.com/worldcoin/biometrics-tee", rev = "58ad2b3cc93570d421c2da2c4ab058ed98ef88c0" }
serde_json.workspace = true
hex.workspace = true

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dev-dependencies]
wasm-bindgen-test.workspace = true

[lints]
workspace = true
