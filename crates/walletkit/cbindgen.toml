# Generates native/include/walletkit_coreFFI.h, the C ABI of the `c` feature:
#   cbindgen --config crates/walletkit/cbindgen.toml --output native/include/walletkit_coreFFI.h crates/walletkit
language = "C"
include_guard = "WALLETKIT_CORE_FFI_H"
autogen_warning = "/* Generated by cbindgen from crates/walletkit/src/native/c. Do not edit. */"
sys_includes = ["stdbool.h", "stddef.h", "stdint.h"]
no_includes = true
cpp_compat = true
documentation_style = "c99"
usize_is_size_t = true
style = "both"

[export]
prefix = "WalletKit"
exclude = ["ABI_VERSION"]

[fn]
args = "vertical"

[parse]
parse_deps = false
