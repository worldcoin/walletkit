[package]
name = "walletkit"
description = "Reference implementation for World ID clients."


version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "walletkit"

[dependencies]
walletkit-core = { workspace = true }
uniffi = { workspace = true }

[target.'cfg(all(target_arch = "wasm32", target_os = "unknown"))'.dependencies]
# ubrn's browser player supplies the UniFFI runtime imports for the generated module.
uniffi-runtime-wasm = "0.31.0-5"
walletkit-core = { workspace = true, features = ["uniffi-wasm"] }

[features]
default = ["issuers"]
semaphore = ["walletkit-core/semaphore"]
compress-zkeys = ["walletkit-core/compress-zkeys"]
issuers = ["walletkit-core/issuers"]
# Embeds zkeys into the binary for `EmbeddedZkArtifacts`.
# See walletkit-core's `embed-zkeys` feature for details.
embed-zkeys = ["walletkit-core/embed-zkeys"]

# v3 features
v3 = ["walletkit-core/v3"]

[lints]
workspace = true
