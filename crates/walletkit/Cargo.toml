[package]
name = "walletkit"
description = "Reference implementation for World ID clients."


version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
homepage.workspace = true
repository.workspace = true
exclude.workspace = true
readme.workspace = true
keywords.workspace = true
categories.workspace = true

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "walletkit"

[dependencies]
walletkit-core = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
async-trait = { workspace = true, optional = true }
cesu8 = { version = "1.1", optional = true }
futures-util = { workspace = true, optional = true }
jni = { version = "0.21.1", optional = true }
ruint = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "net"], optional = true }
tracing = { workspace = true, optional = true }
walletkit-jni-macros = { workspace = true, optional = true }
zeroize = { workspace = true, optional = true }

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
tempfile.workspace = true

[features]
default = ["issuers"]
# Typed JNI entry points for the Kotlin SDK (Android AAR).
jni = ["native", "dep:cesu8", "dep:jni", "dep:tracing", "dep:walletkit-jni-macros"]
# Shared runtime of the bindings; enable a binding feature instead.
native = [
  "dep:async-trait",
  "dep:futures-util",
  "dep:ruint",
  "dep:tokio",
  "dep:zeroize",
]
semaphore = ["walletkit-core/semaphore"]
compress-zkeys = ["walletkit-core/compress-zkeys"]
issuers = ["walletkit-core/issuers"]
# Embeds zkeys into the binary for `EmbeddedZkArtifacts`.
# See walletkit-core's `embed-zkeys` feature for details.
embed-zkeys = ["walletkit-core/embed-zkeys"]

# v3 features
v3 = ["walletkit-core/v3"]

[lints]
workspace = true
