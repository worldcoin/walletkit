[graph]
# Cargo deny will check dependencies via `--all-features`
all-features = true

[sources]
unknown-registry = "deny"

[bans]
deny = [
  { name = "openssl", reason = "increases complexity for foreign binding compilation and bundle size" },
]

[licenses]
version = 2
# We want really high confidence when inferring licenses from text
confidence-threshold = 1.0

# List of explicitly allowed licenses
# See https://spdx.org/licenses/ for list of possible licenses
allow = [
  "0BSD",
  "Apache-2.0 WITH LLVM-exception",
  "Apache-2.0",
  "BSD-2-Clause",
  # "BSD-2-Clause-Patent",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "CDLA-Permissive-2.0",
  "ISC",
  "MIT",
  "MPL-2.0",             # Although this is copyleft, it is scoped to modifying the original files
  "OpenSSL",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[[licenses.clarify]]
name = "webpki"
version = "0.22.4"
expression = "ISC"
license-files = [{ path = "LICENSE", hash = 0x001c7e6c }]

# Ignore unmaintained required crates warning
[advisories]
ignore = [
  "RUSTSEC-2024-0388", # Unmaintained `derivative` (2024-11-22)
  "RUSTSEC-2024-0436", # Unmaintained `paste` (2025-04-04)
  "RUSTSEC-2023-0089", # Unmaintained `atomic-polyfill` (2025-06-03)
  "RUSTSEC-2026-0247", # Unmaintained `bitmaps` (transitive via `im` / `provekit` / `world-id-proof`)
  "RUSTSEC-2026-0248", # Unmaintained `im` (transitive via `provekit` / `world-id-proof`)
  "RUSTSEC-2026-0251", # Unmaintained `sized-chunks` (transitive via `im` / `provekit` / `world-id-proof`)
  # Askama still requires basic-toml for config parsing through uniffi_bindgen and
  # taceo-groth16-sol. Remove once both dependency paths stop enabling it.
  { id = "RUSTSEC-2026-0374", reason = "unmaintained basic-toml required by Askama; no patched release" },
  # webpki-roots / webpki-root-certs 0.26.11 are shims that re-export the 1.x crates (locked
  # at 1.0.10, which removes the emSign root), but the advisories still match them. webpki-roots
  # 0.26 comes from flamingo-verifier-client and tokio-tungstenite; webpki-root-certs 0.26 from
  # rustls-platform-verifier 0.5 via jsonrpsee. Drop these once none of them depends on 0.26.
  { id = "RUSTSEC-2026-0381", reason = "only matches the webpki-roots 0.26.11 shim over 1.0.10" },
  { id = "RUSTSEC-2026-0383", reason = "only matches the webpki-root-certs 0.26.11 shim over 1.0.10" },
]
