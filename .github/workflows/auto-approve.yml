name: Auto approve

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, labeled, unlabeled]
  issue_comment:
    types: [created, edited, deleted]
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to review
        required: true
        type: number

permissions:
  contents: read
  pull-requests: read

jobs:
  select:
    if: >-
      (github.event_name == 'pull_request_target' && github.event.pull_request.base.ref == 'main') ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request) ||
      (github.event_name == 'schedule') ||
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      prs: ${{ steps.select.outputs.prs }}
    steps:
      - name: Select pull requests
        id: select
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python3 - <<'PY'
          import json, os, subprocess
          event = json.load(open(os.environ['GITHUB_EVENT_PATH']))
          kind = os.environ['GITHUB_EVENT_NAME']
          if kind == 'schedule':
              result = subprocess.run(
                  ['gh', 'api', f"repos/{os.environ['GH_REPO']}/pulls?state=open&base=main&per_page=100",
                   '--paginate', '--slurp'], check=True, capture_output=True, text=True, timeout=90)
              prs = [p['number'] for page in json.loads(result.stdout) for p in page
                     if not p['draft'] and p['head']['repo']
                     and p['head']['repo']['full_name'] == os.environ['GH_REPO']]
          elif kind == 'workflow_dispatch':
              prs = [int(event['inputs']['pr_number'])]
          elif kind == 'issue_comment':
              prs = [event['issue']['number']]
          else:
              prs = [event['pull_request']['number']]
          if len(prs) > 100 or any(type(n) is not int or n <= 0 for n in prs):
              raise ValueError('Unsupported PR selection; use workflow_dispatch for individual PRs')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('prs=' + json.dumps(prs) + '\n')
          PY

  review:
    needs: select
    if: needs.select.outputs.prs != '[]'
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        pr: ${{ fromJSON(needs.select.outputs.prs) }}
    uses: ./.github/workflows/review-for-approval.yml
    with:
      pr_number: ${{ matrix.pr }}
    secrets:
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      APPROVAL_TOKEN: ${{ secrets.WALLETKIT_BOT_TOKEN }}
