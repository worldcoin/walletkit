name: Auto approve

# Approves a pull request once the automated reviewer has reviewed the current
# head, so the reviewer is the gate. Its comments must be resolved before the
# merge, which branch protection requires separately.
#
# `wld-walletkit-bot` is in .github/CODEOWNERS so its approval satisfies the code
# owner requirement.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  BOT_LOGIN: "wld-walletkit-bot"
  REVIEW_BOTS: "cursor[bot],copilot-pull-request-reviewer[bot]"
  REVIEW_CHECKS: "Cursor Bugbot"
  POLL_SECONDS: "30"
  REVIEW_TIMEOUT_SECONDS: "600"

jobs:
  auto-approve:
    name: auto-approve
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the automated review
        id: review
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const reviewerBots = new Set(
              (process.env.REVIEW_BOTS || '').split(',').map((value) => value.trim()).filter(Boolean)
            );
            const reviewerChecks = new Set(
              (process.env.REVIEW_CHECKS || '').split(',').map((value) => value.trim()).filter(Boolean)
            );

            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) {
              core.setFailed('No pull request in the event payload.');
              return;
            }

            // A review event's payload head can lag a newer push.
            async function reviewOfHead() {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              const head = pr.head.sha;

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: number,
                per_page: 100,
              });
              // The reviewer skips some pushes, leaving no review to wait for.
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: head,
                per_page: 100,
              });

              return {
                pr,
                head,
                reviewed:
                  reviews.some((review) => reviewerBots.has(review.user?.login) && review.commit_id === head) ||
                  checkRuns.some((run) => reviewerChecks.has(run.name) && run.status === 'completed'),
              };
            }

            let { pr, head, reviewed } = await reviewOfHead();

            const deadline = Date.now() + Number(process.env.REVIEW_TIMEOUT_SECONDS) * 1000;
            const pollMs = Number(process.env.POLL_SECONDS) * 1000;
            while (!reviewed && Date.now() + pollMs <= deadline) {
              core.info(`Waiting for the automated review of ${head.slice(0, 7)}...`);
              await new Promise((resolve) => setTimeout(resolve, pollMs));
              ({ pr, head, reviewed } = await reviewOfHead());
            }

            await core.summary
              .addHeading('auto-approve')
              .addRaw(`Head: ${head}\n\n`)
              .addRaw(`Automated review on head: ${reviewed}\n`)
              .write();

            if (!reviewed) {
              core.setFailed(
                `No automated review of ${head.slice(0, 7)} from ${[...reviewerBots, ...reviewerChecks].join(' or ')}.`
              );
              return;
            }

            // Only `main`, only non-drafts, and never its own pull requests: GitHub
            // does not allow an author to approve their own.
            core.setOutput(
              'approve',
              String(pr.base.ref === 'main' && !pr.draft && pr.user.login !== process.env.BOT_LOGIN)
            );

      - name: Approve
        if: steps.review.outputs.approve == 'true'
        env:
          GH_TOKEN: ${{ secrets.WALLETKIT_BOT_TOKEN }}
        run: gh pr review --approve "${{ github.event.pull_request.number }}"
