name: Auto approve

# A pi agent reviews the pull request and answers whether it is ok to auto-approve. The answer is
# posted as a pull request comment and put to a jev decision model; the action approves only when
# jev approves and the guards hold. The logic lives in .github/actions/auto-review.
#
# `pull_request_target` runs this file, and the checkout below, from the base branch, so a pull
# request cannot rewrite the job that approves it, and the guidelines, policy file and skills the
# action reads are the base branch's.

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: auto-approve-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  auto-approve:
    name: auto-approve
    # The workflow file itself comes from the pull request's base branch, so every other base would
    # run that branch's copy of it with these secrets in scope. Keep them out of reach entirely.
    if: github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      # The action is local, and it reads the guidelines, the policy file and the skills from this
      # checkout. On pull_request_target the default ref is the base branch, which is what those
      # files must come from.
      - name: Checkout the base branch
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Auto review
        uses: ./.github/actions/auto-review
        with:
          openrouter-api-key: ${{ secrets.OPENROUTER_API_KEY }}
          bot-token: ${{ secrets.WALLETKIT_BOT_TOKEN }}
          bot-login: wld-walletkit-bot