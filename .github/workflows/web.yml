name: Web package (@worldcoin/walletkit-web)

# Builds, tests and publishes the `@worldcoin/walletkit-web` npm package.
#
# - pull_request / push to main: build the package from source, run the browser tests
#   and check the tarball. Nothing is published.
# - release (published by release-plz, tag vX.Y.Z): build the same way, stamp the
#   release version and publish that exact tarball to npm.
#
# Publishing uses npm trusted publishing (OIDC), so no npm token is stored in the
# repository. See docs/web/releasing.md.

on:
  pull_request:
    paths:
      - ".cargo/**"
      - ".github/workflows/web.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/walletkit-core/**"
      - "crates/walletkit-db/**"
      - "crates/walletkit-sqlite/**"
      - "crates/walletkit-web/**"
      - "examples/web/**"
      - "flake.lock"
      - "flake.nix"
      - "nix/**"
      - "rust-toolchain.toml"
      - "web/walletkit/**"
  push:
    branches:
      - main
    paths:
      - ".cargo/**"
      - ".github/workflows/web.yml"
      - "Cargo.lock"
      - "Cargo.toml"
      - "crates/walletkit-core/**"
      - "crates/walletkit-db/**"
      - "crates/walletkit-sqlite/**"
      - "crates/walletkit-web/**"
      - "examples/web/**"
      - "flake.lock"
      - "flake.nix"
      - "nix/**"
      - "rust-toolchain.toml"
      - "web/walletkit/**"
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  # Never cancel a release run half-way through publishing.
  group: web-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build & test @worldcoin/walletkit-web
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - name: Checkout code
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      # Only releases carry a version: it comes from the release tag (vX.Y.Z), which
      # release-plz derives from the workspace version.
      - name: Resolve release version
        id: version
        if: github.event_name == 'release'
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          VERSION="${TAG#v}"
          if ! [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not vX.Y.Z"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Install Nix
        uses: cachix/install-nix-action@8aa03977d8d733052d78f4e008a241fd1dbf36b3 # v31.10.6

      # TODO: magic-nix-cache is best-effort; builds still work without it.
      - name: Enable Nix cache
        uses: DeterminateSystems/magic-nix-cache-action@565684385bcd71bad329742eefe8d12f2e765b39 # v13
        with:
          use-gha-cache: ${{ github.event_name != 'release' }}

      # The pinned toolchain (Rust, wasm-bindgen CLI, Binaryen, bun, nargo) is the same
      # one the docs use locally, so CI builds what developers build.
      - name: Install dependencies
        run: nix develop .#wasm --command bun install --cwd web/walletkit --frozen-lockfile

      - name: Build package (Rust, wasm-bindgen, wasm-opt, bundle)
        run: nix develop .#wasm --command bun run --cwd web/walletkit build

      - name: Check formatting
        run: nix develop .#wasm --command bun run --cwd web/walletkit format:check

      # The tests drive the installed Google Chrome (`channel: "chrome"`).
      - name: Run browser tests
        run: |
          google-chrome --version
          nix develop .#wasm --command bun run --cwd web/walletkit test:browser

      # The Next.js demo is the package's integration consumer: it must keep
      # type-checking, testing and bundling against the package just built.
      - name: Check the Next.js demo against the package
        working-directory: examples/web
        run: |
          nix develop ../..#wasm --command bash -c '
            set -euo pipefail
            bun run walletkit:link
            bun test
            # Build first: it generates the Next route types the type check imports.
            bun run build
            bunx tsc --noEmit -p tsconfig.json
          '

      - name: Upload browser test report
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: walletkit-web-test-results
          path: web/walletkit/test-results
          if-no-files-found: ignore
          retention-days: 7

      - name: Stamp release version
        if: steps.version.outputs.version
        env:
          VERSION: ${{ steps.version.outputs.version }}
        working-directory: web/walletkit
        run: |
          nix develop ../..#wasm --command npm version "$VERSION" \
            --no-git-tag-version --allow-same-version

      - name: Pack and verify tarball
        working-directory: web/walletkit
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/pack"
          nix develop ../..#wasm --command npm pack --pack-destination "$RUNNER_TEMP/pack"
          TARBALL=$(ls "$RUNNER_TEMP"/pack/*.tgz)
          echo "TARBALL=$TARBALL" >> "$GITHUB_ENV"
          # List once: `tar | grep -q` would fail under pipefail when grep exits early.
          CONTENTS=$(tar -tzf "$TARBALL")
          echo "$CONTENTS"
          for file in dist/index.js dist/index.d.ts dist/walletkit.worker.js \
            dist/generated/walletkit.wasm dist/generated/walletkit.d.ts README.md; do
            grep -qx "package/$file" <<< "$CONTENTS" || {
              echo "::error::$file is missing from the package tarball"
              exit 1
            }
          done

      - name: Upload package
        if: steps.version.outputs.version
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: walletkit-web-package
          path: ${{ env.TARBALL }}
          if-no-files-found: error
          retention-days: 14

  publish:
    name: Publish @worldcoin/walletkit-web to npm
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Same gate as the crates release; it is also the environment named in the npm
    # trusted publisher configuration.
    environment: production
    permissions:
      contents: read
      id-token: write # npm trusted publishing + provenance

    steps:
      - name: Download package
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: walletkit-web-package
          path: package

      # Trusted publishing needs npm >= 11.5.1.
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Re-running a failed release must not fail on, or overwrite, a published version.
      - name: Check whether the version is already published
        id: published
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          if npm view "@worldcoin/walletkit-web@$VERSION" version > /dev/null 2>&1; then
            echo "::notice::@worldcoin/walletkit-web@$VERSION is already on npm; skipping publish"
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish
        if: steps.published.outputs.exists == 'false'
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          set -euo pipefail
          # Pre-releases must not become `latest`.
          TAG=latest
          if [[ "$VERSION" == *-* ]]; then TAG=next; fi
          npm publish package/*.tgz --provenance --access public --tag "$TAG"
