name: Risk gate

# Required check on `main`. Decides whether a pull request needs a human review.
# Mechanical changes (docs, tests, examples) that the automated reviewer has
# reviewed on the current head pass without one, which is how a code owner merges
# without an extra review. Everything else fails until a code owner approves the
# current head. A missing automated review counts as high risk, so this fails
# closed.
#
# A pull request can edit this file, which is why the merge requirements are also
# enforced in branch protection (worldcoin/infrastructure). See the pull request
# description for the limits of this check.
#
# `main` requires this check by the name `risk-gate`, so the job name and the
# context in worldcoin/infrastructure must match.

on:
  pull_request:
    # `edited` covers a pull request retargeted at `main`.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # Re-evaluate when a review arrives or is dismissed.
  pull_request_review:
    types: [submitted, dismissed]
  # The reviewer skips some pushes, leaving no review to trigger on; its check run
  # completing is the other signal.
  check_run:
    types: [completed]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: risk-gate-${{ github.event.pull_request.number || github.event.check_run.pull_requests[0].number }}
  cancel-in-progress: true

env:
  # The automated review of the current head. A review object from one of these
  # authors, or a completed check run with one of these names, counts; Cursor
  # Bugbot is enabled on the repository and skips some pushes.
  REVIEW_BOTS: "cursor[bot],copilot-pull-request-reviewer[bot]"
  REVIEW_CHECKS: "Cursor Bugbot"

jobs:
  risk-gate:
    name: risk-gate
    runs-on: ubuntu-latest
    steps:
      - name: Assess risk
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            // Mechanical changes: a reviewer would approve these without reading
            // the diff. Anything not listed here is high risk.
            const mechanical = [
              /\.md$/i,
              /^docs\//i,
              /^examples\//i,
              /^audits\//i,
              /^swift\/tests\//i,
              /^kotlin\/walletkit-tests\//i,
              /^crates\/[^/]+\/tests\//i,
              /_test\.rs$/i,
            ];

            const reviewerBots = new Set(
              (process.env.REVIEW_BOTS || '').split(',').map((value) => value.trim()).filter(Boolean)
            );
            const reviewerChecks = new Set(
              (process.env.REVIEW_CHECKS || '').split(',').map((value) => value.trim()).filter(Boolean)
            );

            const { owner, repo } = context.repo;
            const number =
              context.payload.pull_request?.number ?? context.payload.check_run?.pull_requests?.[0]?.number;

            if (!number) {
              if (context.payload.check_run) {
                core.notice('Check run is not attached to a pull request; nothing to assess.');
                return;
              }
              core.setFailed('No pull request in the event payload.');
              return;
            }

            // Re-read the pull request: on a review event the payload's head can
            // lag a newer push, and this must judge the commit being merged.
            const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
            const head = pr.head.sha;

            const files = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: number,
              per_page: 100,
            });

            // A rename is judged on both sides, so moving a source file into a
            // mechanical path does not count as mechanical.
            const risky = files.filter((file) =>
              [file.filename, file.previous_filename]
                .filter(Boolean)
                .some((path) => !mechanical.some((pattern) => pattern.test(path)))
            );
            const isMechanical = files.length > 0 && risky.length === 0;

            const reviews = await github.paginate(github.rest.pulls.listReviews, {
              owner,
              repo,
              pull_number: number,
              per_page: 100,
            });

            // The reviewer skips some pushes, so a finished check run on the head
            // counts as well: otherwise the gate waits for a review that never
            // arrives.
            const checkRuns = await github.paginate(github.rest.checks.listForRef, {
              owner,
              repo,
              ref: head,
              per_page: 100,
            });
            const reviewedHead =
              reviews.some((review) => reviewerBots.has(review.user?.login) && review.commit_id === head) ||
              checkRuns.some((run) => reviewerChecks.has(run.name) && run.status === 'completed');

            // Owners are read from the base branch, so a pull request cannot widen
            // who is allowed to approve its own gate. Team handles are not resolved.
            const owners = new Set();
            try {
              const { data: codeowners } = await github.rest.repos.getContent({
                owner,
                repo,
                path: '.github/CODEOWNERS',
                ref: pr.base.sha,
              });
              for (const line of Buffer.from(codeowners.content, 'base64').toString('utf8').split('\n')) {
                const body = line.split('#')[0].trim();
                if (!body) continue;
                for (const handle of body.split(/\s+/).slice(1)) {
                  if (handle.startsWith('@') && !handle.includes('/')) owners.add(handle.slice(1).toLowerCase());
                }
              }
            } catch (error) {
              // No CODEOWNERS on the base branch: nothing can approve.
              core.info(`Could not read .github/CODEOWNERS: ${error.message}`);
            }

            const isOwner = (login) => owners.has(String(login).toLowerCase()) && login !== pr.user.login;

            // Only a reviewer's latest decisive review counts, so an approval that a
            // later change request superseded is not an approval.
            const latestByReviewer = new Map();
            for (const review of reviews) {
              if (!['APPROVED', 'CHANGES_REQUESTED'].includes(review.state)) continue;
              const login = review.user?.login;
              if (!login) continue;
              const previous = latestByReviewer.get(login);
              if (!previous || new Date(review.submitted_at) >= new Date(previous.submitted_at)) {
                latestByReviewer.set(login, review);
              }
            }

            const changesRequestedBy = [...latestByReviewer.values()]
              .filter((review) => review.state === 'CHANGES_REQUESTED' && isOwner(review.user.login))
              .map((review) => review.user.login);

            const approved = [...latestByReviewer.values()].some(
              (review) => review.state === 'APPROVED' && review.commit_id === head && isOwner(review.user.login)
            );

            await core.summary
              .addHeading('risk-gate')
              .addRaw(`Head: ${head}\n\n`)
              .addRaw(`Mechanical change: ${isMechanical}\n\n`)
              .addRaw(`Automated review on head: ${reviewedHead}\n\n`)
              .addRaw(`Approved by a code owner other than the author: ${approved}\n\n`)
              .addRaw(`Outstanding change requests: ${changesRequestedBy.join(', ') || 'none'}\n`)
              .write();

            if (!reviewedHead) {
              core.setFailed(
                `Waiting for an automated review of ${head.slice(0, 7)} from ${[...reviewerBots, ...reviewerChecks].join(' or ')}.`
              );
              return;
            }

            if (isMechanical) {
              core.notice(`Mechanical change, reviewed on ${head.slice(0, 7)}; no human review required.`);
              return;
            }

            if (approved && changesRequestedBy.length === 0) {
              core.notice(`Approved by a code owner on ${head.slice(0, 7)}.`);
              return;
            }

            core.setFailed(
              [
                `${risky.length} file(s) outside the mechanical allow-list: ${risky.slice(0, 5).map((file) => file.filename).join(', ')}${risky.length > 5 ? ', ...' : ''}.`,
                changesRequestedBy.length > 0
                  ? `Waiting on change requests from: ${changesRequestedBy.join(', ')}.`
                  : `An approval on ${head.slice(0, 7)} from a code owner other than the author is required.`,
              ].join('\n')
            );
