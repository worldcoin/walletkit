name: Risk gate

# Required check on `main`. The automated reviewer is the risk gate: once it has
# reviewed the current head, the pull request needs no further review. Its
# comments block the merge until they are resolved, which branch protection
# enforces separately (required conversation resolution), and new commits need a
# fresh review of the head.
#
# `main` requires this check by the name `risk-gate`, so the job name and the
# context in worldcoin/infrastructure must match.

on:
  pull_request:
    # `edited` covers a pull request retargeted at `main`.
    types: [opened, synchronize, reopened, ready_for_review, edited]
  # Re-evaluate when a review arrives or is dismissed.
  pull_request_review:
    types: [submitted, dismissed]

permissions:
  checks: read
  contents: read
  pull-requests: read

concurrency:
  group: risk-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  # The automated reviewer: a review of the current head from one of these
  # authors, or a completed check run with one of these names, counts. Cursor
  # Bugbot is enabled on the repository; Copilot is not.
  REVIEW_BOTS: "cursor[bot],copilot-pull-request-reviewer[bot]"
  REVIEW_CHECKS: "Cursor Bugbot"
  # The reviewer takes minutes and posts nothing when it finishes, so wait for it
  # rather than fail and leave a stale check behind.
  POLL_SECONDS: "30"
  REVIEW_TIMEOUT_SECONDS: "600"

jobs:
  risk-gate:
    name: risk-gate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Wait for the automated review
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const reviewerBots = new Set(
              (process.env.REVIEW_BOTS || '').split(',').map((value) => value.trim()).filter(Boolean)
            );
            const reviewerChecks = new Set(
              (process.env.REVIEW_CHECKS || '').split(',').map((value) => value.trim()).filter(Boolean)
            );

            const { owner, repo } = context.repo;
            const number = context.payload.pull_request?.number;
            if (!number) {
              core.setFailed('No pull request in the event payload.');
              return;
            }

            // Re-read the pull request: on a review event the payload's head can lag
            // a newer push, and this should judge the commit being merged.
            async function reviewOfHead() {
              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: number });
              const head = pr.head.sha;

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: number,
                per_page: 100,
              });
              // The reviewer skips some pushes, leaving no review to wait for, so a
              // finished check run on the head counts as well.
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: head,
                per_page: 100,
              });

              return {
                head,
                reviewed:
                  reviews.some((review) => reviewerBots.has(review.user?.login) && review.commit_id === head) ||
                  checkRuns.some((run) => reviewerChecks.has(run.name) && run.status === 'completed'),
              };
            }

            let { head, reviewed } = await reviewOfHead();

            const deadline = Date.now() + Number(process.env.REVIEW_TIMEOUT_SECONDS) * 1000;
            const pollMs = Number(process.env.POLL_SECONDS) * 1000;
            while (!reviewed && Date.now() + pollMs <= deadline) {
              core.info(`Waiting for the automated review of ${head.slice(0, 7)}...`);
              await new Promise((resolve) => setTimeout(resolve, pollMs));
              ({ head, reviewed } = await reviewOfHead());
            }

            await core.summary
              .addHeading('risk-gate')
              .addRaw(`Head: ${head}\n\n`)
              .addRaw(`Automated review on head: ${reviewed}\n`)
              .write();

            if (!reviewed) {
              core.setFailed(
                `No automated review of ${head.slice(0, 7)} from ${[...reviewerBots, ...reviewerChecks].join(' or ')}.`
              );
              return;
            }

            core.notice(`Reviewed on ${head.slice(0, 7)}; resolve any review comments to merge.`);
